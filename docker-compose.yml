services:

  # ─── Application (PHP-FPM + Nginx) ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_LEVEL: error
    volumes:
      # Persistance des fichiers uploadés entre les redéploiements
      - storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network   # exposé à Traefik
      - internal          # communication privée avec la DB

  # ─── Base de données MySQL ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql   # données MySQL persistées
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$DB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal   # jamais exposé à Traefik

volumes:
  db-data:    # données MySQL
  storage:    # fichiers uploadés Laravel

networks:
  dokploy-network:
    external: true   # réseau géré par Dokploy / Traefik
  internal:
    driver: bridge   # réseau privé app ↔ db
